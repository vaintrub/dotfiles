#chezmoi:modify-template
{{- /*
  chezmoi modify_ template for ~/.codex/config.toml.
  Annotation tells chezmoi to render this as a template; .chezmoi.stdin
  contains current target file contents. Template output IS new file content.

  The curated base is merged over the live file: base wins for the keys it
  declares, and everything Codex writes at runtime (trust rows, marketplaces,
  TUI state) passes through. None of it can reach git through apply, which
  writes only the target — see AGENTS.md §9 for the one command that does.
*/ -}}
{{- $existing := fromToml .chezmoi.stdin -}}
{{- $base := fromToml (includeTemplate "codex-config-base.toml" .) -}}
{{- toToml (mergeOverwrite $existing $base) -}}
