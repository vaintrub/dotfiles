- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.vimrc:
    ~/.zshrc:
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.p10k.zsh:
      path: p10k.zsh
      force: true
    ~/.tmux.conf:
      path: tmux/oh-my-tmux/.tmux.conf
      force: true
    ~/.tmux.conf.local:
      path: tmux/tmux.conf.local
      force: true

- shell:
  - description: Install MesloLGS Nerd Font (Powerlevel10k recommended)
    command: |
      case "$(uname -s)" in
        Darwin)
          if ! command -v brew >/dev/null 2>&1; then
            echo "Skipping font install: Homebrew not available"
            exit 0
          fi
          if brew list --cask font-meslo-lg-nerd-font >/dev/null 2>&1; then
            echo "MesloLGS Nerd Font already installed"
          else
            brew install --cask font-meslo-lg-nerd-font
          fi
          ;;
        Linux)
          # Headless SSH: glyphs render on the local terminal — skip remote install.
          if [ -n "$SSH_CONNECTION" ] && [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; then
            echo "Headless/SSH session — font lives on the local terminal, skipping"
            exit 0
          fi
          dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
          if command -v fc-list >/dev/null 2>&1 && fc-list | grep -qi "MesloLGS NF"; then
            echo "MesloLGS Nerd Font already installed"
            exit 0
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "Skipping font install: curl not available"
            exit 0
          fi
          mkdir -p "$dir"
          base="https://github.com/romkatv/powerlevel10k-media/raw/master"
          for variant in Regular Bold Italic "Bold Italic"; do
            fname="MesloLGS NF ${variant}.ttf"
            # POSIX URL encoding (dotbot shell: runs under /bin/sh, which is dash on Ubuntu).
            urlname=$(printf '%s' "$fname" | sed 's/ /%20/g')
            [ -f "$dir/$fname" ] || curl -fsSL "$base/$urlname" -o "$dir/$fname"
          done
          command -v fc-cache >/dev/null 2>&1 && fc-cache -f "$dir" >/dev/null
          echo "MesloLGS Nerd Font installed to $dir"
          ;;
        *)
          echo "Unsupported OS: $(uname -s)" >&2
          exit 1
          ;;
      esac
    stdout: true
    stderr: true

  - description: Install Visual Studio Code via Homebrew cask (macOS only)
    command: |
      [ "$(uname -s)" = Darwin ] || exit 0
      # App presence is the source of truth — works for both brew-cask and
      # pre-existing manual installs. `code` on PATH is handled by zshrc.
      if [ -d "/Applications/Visual Studio Code.app" ]; then
        echo "Visual Studio Code already installed"
        exit 0
      fi
      if ! command -v brew >/dev/null 2>&1; then
        echo "Skipping VSCode install: Homebrew not available"
        exit 0
      fi
      brew install --cask visual-studio-code
    stdout: true
    stderr: true

  - description: Point iTerm2 at the repo's iterm/ folder for preferences (macOS only)
    command: |
      [ "$(uname -s)" = Darwin ] || exit 0
      iterm_dir="$PWD/iterm"
      current=$(defaults read com.googlecode.iterm2 PrefsCustomFolder 2>/dev/null || true)
      load=$(defaults read com.googlecode.iterm2 LoadPrefsFromCustomFolder 2>/dev/null || true)
      if [ "$current" = "$iterm_dir" ] && [ "$load" = "1" ]; then
        echo "iTerm2 already loading prefs from $iterm_dir"
        exit 0
      fi
      defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$iterm_dir"
      defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true
      echo "iTerm2 configured. Quit and relaunch iTerm2 (Don't Save if asked) to apply."
    stdout: true
    stderr: true

  - description: Linux clipboard-tool notice (for tmux yank to system clipboard)
    command: |
      [ "$(uname -s)" = Linux ] || exit 0
      if ! command -v xsel    >/dev/null 2>&1 \
         && ! command -v xclip   >/dev/null 2>&1 \
         && ! command -v wl-copy >/dev/null 2>&1; then
        echo "Note: no clipboard tool detected."
        echo "      tmux copy-mode yank will not reach the system clipboard."
        echo "      Install one: apt install xsel  (or wl-clipboard for Wayland)"
      fi
    stdout: true
    stderr: true
