- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.vimrc:
    ~/.zshrc:
    ~/.zsh_plugins.txt: zsh_plugins.txt
    ~/.p10k.zsh:
      path: p10k.zsh
      force: true
    ~/.tmux.conf:
      path: tmux/oh-my-tmux/.tmux.conf
      force: true
    ~/.tmux.conf.local:
      path: tmux/tmux.conf.local
      force: true
    # --- Claude Code ---
    # Settings, instructions, status-line script, and the four content
    # dirs Claude Code looks at (agents, commands, skills, hooks).
    # `force: true` because pre-existing files at these paths get replaced
    # by symlinks pointing into the repo.
    ~/.claude/CLAUDE.md:
      path: claude/CLAUDE.md
      force: true
    ~/.claude/settings.json:
      path: claude/settings.json
      force: true
    ~/.claude/statusline-command.sh:
      path: claude/statusline-command.sh
      force: true
    ~/.claude/agents:
      path: claude/agents
      force: true
    ~/.claude/commands:
      path: claude/commands
      force: true
    ~/.claude/skills:
      path: claude/skills
      force: true
    ~/.claude/hooks:
      path: claude/hooks
      force: true
    # --- OpenAI Codex CLI ---
    # config.toml is symlinked; Codex auto-writes runtime sections into it,
    # which the git clean filter (registered below) strips on `git add`.
    # skills/ is symlinked too; Codex creates `.system/` inside for built-in
    # skills — that path is .gitignore'd at repo root.
    ~/.codex/config.toml:
      path: codex/config.toml
      force: true
    ~/.codex/skills:
      path: codex/skills
      force: true

- shell:
  - description: Install MesloLGS Nerd Font (Powerlevel10k recommended)
    command: |
      case "$(uname -s)" in
        Darwin)
          if ! command -v brew >/dev/null 2>&1; then
            echo "Skipping font install: Homebrew not available"
            exit 0
          fi
          if brew list --cask font-meslo-lg-nerd-font >/dev/null 2>&1; then
            echo "MesloLGS Nerd Font already installed"
          else
            brew install --cask font-meslo-lg-nerd-font
          fi
          ;;
        Linux)
          # Headless SSH: glyphs render on the local terminal — skip remote install.
          if [ -n "$SSH_CONNECTION" ] && [ -z "$DISPLAY" ] && [ -z "$WAYLAND_DISPLAY" ]; then
            echo "Headless/SSH session — font lives on the local terminal, skipping"
            exit 0
          fi
          dir="${XDG_DATA_HOME:-$HOME/.local/share}/fonts"
          if command -v fc-list >/dev/null 2>&1 && fc-list | grep -qi "MesloLGS NF"; then
            echo "MesloLGS Nerd Font already installed"
            exit 0
          fi
          if ! command -v curl >/dev/null 2>&1; then
            echo "Skipping font install: curl not available"
            exit 0
          fi
          mkdir -p "$dir"
          base="https://github.com/romkatv/powerlevel10k-media/raw/master"
          for variant in Regular Bold Italic "Bold Italic"; do
            fname="MesloLGS NF ${variant}.ttf"
            # POSIX URL encoding (dotbot shell: runs under /bin/sh, which is dash on Ubuntu).
            urlname=$(printf '%s' "$fname" | sed 's/ /%20/g')
            [ -f "$dir/$fname" ] || curl -fsSL "$base/$urlname" -o "$dir/$fname"
          done
          command -v fc-cache >/dev/null 2>&1 && fc-cache -f "$dir" >/dev/null
          echo "MesloLGS Nerd Font installed to $dir"
          ;;
        *)
          echo "Unsupported OS: $(uname -s)" >&2
          exit 1
          ;;
      esac
    stdout: true
    stderr: true

  - description: Install Visual Studio Code via Homebrew cask (macOS only)
    command: |
      [ "$(uname -s)" = Darwin ] || exit 0
      # App presence is the source of truth — works for both brew-cask and
      # pre-existing manual installs. `code` on PATH is handled by zshrc.
      if [ -d "/Applications/Visual Studio Code.app" ]; then
        echo "Visual Studio Code already installed"
        exit 0
      fi
      if ! command -v brew >/dev/null 2>&1; then
        echo "Skipping VSCode install: Homebrew not available"
        exit 0
      fi
      brew install --cask visual-studio-code
    stdout: true
    stderr: true

  - description: Point iTerm2 at the repo's iterm/ folder for preferences (macOS only)
    command: |
      [ "$(uname -s)" = Darwin ] || exit 0
      iterm_dir="$PWD/iterm"
      current=$(defaults read com.googlecode.iterm2 PrefsCustomFolder 2>/dev/null || true)
      load=$(defaults read com.googlecode.iterm2 LoadPrefsFromCustomFolder 2>/dev/null || true)
      if [ "$current" = "$iterm_dir" ] && [ "$load" = "1" ]; then
        echo "iTerm2 already loading prefs from $iterm_dir"
        exit 0
      fi
      defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$iterm_dir"
      defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true
      echo "iTerm2 configured. Quit and relaunch iTerm2 (Don't Save if asked) to apply."
    stdout: true
    stderr: true

  - description: Linux clipboard-tool notice (for tmux yank to system clipboard)
    command: |
      [ "$(uname -s)" = Linux ] || exit 0
      if ! command -v xsel    >/dev/null 2>&1 \
         && ! command -v xclip   >/dev/null 2>&1 \
         && ! command -v wl-copy >/dev/null 2>&1; then
        echo "Note: no clipboard tool detected."
        echo "      tmux copy-mode yank will not reach the system clipboard."
        echo "      Install one: apt install xsel  (or wl-clipboard for Wayland)"
      fi
    stdout: true
    stderr: true

  - description: Register the codex-strip git filter (idempotent)
    command: |
      # Strip runtime-mutated TOML sections from codex/config.toml on
      # `git add`. See codex/scripts/strip-runtime-sections.awk for the
      # exclusion list and .gitattributes for the binding.
      #
      # `required = true` makes git expect BOTH clean (index ← working
      # tree, on `git add`) and smudge (working tree ← index, on
      # `git checkout`) to be defined. We don't transform on checkout,
      # so smudge is `cat` (identity passthrough) — this is the
      # canonical pattern for clean-only filters per the gitattributes
      # man page ("indent"/"smudge=cat" example). Without explicit
      # smudge, `git checkout` of any branch touching codex/config.toml
      # fails with "smudge filter codex-strip failed".
      clean="awk -f codex/scripts/strip-runtime-sections.awk"
      if [ "$(git config --local filter.codex-strip.clean 2>/dev/null)" != "$clean" ] \
         || [ "$(git config --local filter.codex-strip.smudge 2>/dev/null)" != "cat" ]; then
        git config --local filter.codex-strip.clean    "$clean"
        git config --local filter.codex-strip.smudge   cat
        git config --local filter.codex-strip.required true
        echo "Registered git filter.codex-strip"
      else
        echo "git filter.codex-strip already registered"
      fi
    stdout: true
    stderr: true

  - description: AI CLIs soft-prereq notice (claude, codex)
    command: |
      # Claude Code and OpenAI Codex aren't hard requirements — install
      # still completes on a server-only machine. But the linked configs
      # do nothing until the binaries are present, so flag it.
      ai_missing=""
      for tool in claude codex; do
        command -v "$tool" >/dev/null 2>&1 || ai_missing="${ai_missing}${ai_missing:+ }${tool}"
      done
      if [ -n "$ai_missing" ]; then
        printf '\nNote: AI CLI(s) not on PATH: %s\n' "$ai_missing"
        printf '      Configs in claude/ and codex/ are linked but inert until installed.\n'
        case "$(uname -s)" in
          Darwin) printf '      Install: brew install --cask claude-code codex\n' ;;
          Linux)  printf '      Install: https://claude.com/code  |  https://github.com/openai/codex\n' ;;
        esac
      fi
    stdout: true
    stderr: true
