# OS packages, installed by the two run_onchange_after_50-packages-* scripts.
# Every profile gets core; dev and workstation add dev; workstation adds the
# casks (macOS only). Cross-platform CLI tools (kubectl, gh, claude, codex, …)
# live in dot_config/mise/config.toml.tmpl instead.

packages:
  darwin:
    core:
      - tmux                        # macOS ships zsh/vim/git/curl, not tmux
      - mise
    dev:
      - htop
      - tree
      - wget
      - nmap
      - telnet
      - libpq                       # keg-only; script 50 force-links it
      - wireguard-tools
    casks:
      - iterm2
      - docker-desktop
      - visual-studio-code
      - ngrok
      - 1password                   # desktop app — Touch ID unlock for `op` CLI
  linux:
    core:
      - zsh
      - vim
      - tmux
      - git
      - curl
      - ca-certificates
      - ufw                         # disabled by default; Mac uses App Firewall
      - tcpdump
    dev:
      # Docker is deliberately absent: docker.io (Ubuntu) and docker-ce
      # (Docker's repo) cannot coexist, so each box picks its own.
      - build-essential
      - htop
      - tree
      - wget
      - nmap
      - inetutils-telnet
      - wireguard-tools
      - postgresql-client

# Claude plugins: script 70 installs every one when claude is on PATH. This is
# an install baseline, not enable state (AGENTS.md §9). Codex plugins are
# enabled declaratively by .chezmoitemplates/codex-config-base.toml.
plugins:
  claude:
    - gopls-lsp@claude-plugins-official
    - figma@claude-plugins-official
    - frontend-design@claude-plugins-official
    - mattpocock-skills@claude-plugins-official
    - supabase@claude-plugins-official
  codex:
    - github@openai-curated
    - google-drive@openai-curated
  codex_marketplaces:
    []

# MCP servers for both agents: Claude via `claude mcp add` in script 70, Codex
# declaratively from codex-config-base.toml. Keyless remote (streamable-http)
# servers only — no secrets in this repo. API-keyed servers stay per-machine
# (`<agent> mcp add` by hand).
mcp:
  - name: context7          # up-to-date library/framework docs (Upstash)
    url: https://mcp.context7.com/mcp
