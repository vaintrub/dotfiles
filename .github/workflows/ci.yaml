name: ci
on:
  push:
    branches: [master, "chore/**", "feat/**", "fix/**", "docs/**"]
  # `pull_request` deliberately omitted: solo repo, no fork PRs expected.
  # Pushes to branches above already cover PR sync (PR view shows latest
  # push's CI status). Re-enable if external contributors start opening PRs
  # from forks (push trigger doesn't fire on fork sources; only
  # `pull_request_target` or `pull_request` does).

jobs:
  unit:
    name: unit tests (lib/install-packages.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bats

      - name: Run bats unit tests
        run: bats tests/unit/install-packages.bats

  apply-core:
    name: apply (profile=core, Ubuntu)
    runs-on: ubuntu-latest
    needs: unit
    env:
      # CODESPACES=true is read by .chezmoi.toml.tmpl as the "ephemeral"
      # environment signal — surfaced in the prompt hint. Profile picker
      # still defaults to "core" (promptChoiceOnce default; CI passes
      # --promptDefaults below to accept it without prompting).
      CODESPACES: "true"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: chezmoi init + apply
        run: |
          # Symlink workspace to chezmoi's default source dir so every
          # subsequent `chezmoi *` invocation (e.g. `chezmoi diff` in bats)
          # finds the source without needing --source flag. `chezmoi init
          # --source=PATH` only takes effect for the current invocation;
          # it does NOT persist sourceDir to ~/.config/chezmoi/chezmoi.toml.
          mkdir -p "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init --apply --promptDefaults
          echo "--- chezmoi data ---"
          chezmoi data

      - name: Verify post-apply state
        run: bats tests/files/common.bats

  apply-dev:
    name: apply (profile=dev, Ubuntu)
    runs-on: ubuntu-latest
    needs: unit
    env:
      # Lifts mise's 60/hr anonymous GitHub API rate-limit to 1000/hr.
      # Needed for the 25-tool aqua-backend fetch (~30-50 API calls).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEBIAN_FRONTEND: noninteractive

    steps:
      - uses: actions/checkout@v4

      - name: Cache mise installs
        uses: actions/cache@v4
        with:
          # mise extracts every aqua / language toolchain into per-tool dirs
          # under ~/.local/share/mise/installs/. Cache keyed by hash of the
          # mise config so adding/removing a tool busts the cache cleanly.
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ hashFiles('dot_config/mise/config.toml.tmpl') }}
          restore-keys: mise-${{ runner.os }}-

      - name: Install bats + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Seed chezmoi.toml + symlink source
        run: |
          # Pre-create chezmoi.toml with profile=dev so promptChoiceOnce
          # finds the value and skips the prompt (would otherwise hang on
          # no-TTY CI). Symlink workspace to default source dir so every
          # chezmoi invocation finds the source without --source.
          mkdir -p "$HOME/.config/chezmoi" "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          cat > "$HOME/.config/chezmoi/chezmoi.toml" <<EOF
          [data]
              name    = "CI Tester"
              email   = "ci@example.com"
              profile = "dev"
              osid    = "linux-ubuntu"
          [hooks]
            [hooks.read-source-state]
              [hooks.read-source-state.pre]
                command = "$HOME/.local/share/chezmoi/hooks/ensure-prereqs.sh"
          EOF

      - name: chezmoi apply
        run: chezmoi apply

      - name: Verify post-apply state
        run: |
          bats tests/files/common.bats
          bats tests/files/dev.bats
