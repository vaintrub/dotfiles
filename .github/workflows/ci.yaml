name: ci
on:
  push:
    branches: [master, "chore/**", "feat/**", "feature/**", "fix/**", "docs/**"]
  # `pull_request` deliberately omitted: solo repo, no fork PRs expected.
  # Pushes to branches above already cover PR sync (PR view shows latest
  # push's CI status). Re-enable if external contributors start opening PRs
  # from forks (push trigger doesn't fire on fork sources; only
  # `pull_request_target` or `pull_request` does).

jobs:
  unit:
    name: unit tests (lib/ + repo invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends bats

      - name: Run bats unit tests
        run: bats tests/unit/

  apply:
    name: apply (profile=${{ matrix.profile }}, Ubuntu)
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        profile: [core, dev]
    env:
      DEBIAN_FRONTEND: noninteractive
      # Lifts mise's 60/hr anonymous GitHub API rate-limit to 1000/hr.
      # Needed for the dev tier's aqua-backend fetch (~30-50 API calls);
      # harmless at core tier.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # CODESPACES=true is read by .chezmoi.toml.tmpl as the "ephemeral"
      # environment signal — surfaced in the prompt hint. Only set for the
      # core run, which exercises the non-interactive default path.
      CODESPACES: ${{ matrix.profile == 'core' && 'true' || '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache mise installs
        uses: actions/cache@v6
        with:
          # mise extracts every aqua / language toolchain into per-tool dirs
          # under ~/.local/share/mise/installs/. Cache keyed by profile + hash
          # of the mise config so adding/removing a tool busts it cleanly.
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ matrix.profile }}-${{ hashFiles('dot_config/mise/config.toml.tmpl') }}
          restore-keys: mise-${{ runner.os }}-${{ matrix.profile }}-

      - name: Install bats + jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats jq

      - name: Install chezmoi + put mise shims on PATH ahead of time
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Added before mise populates it, so later steps see the shims.
          # Otherwise the 2nd apply still renders dot_gitconfig.tmpl with
          # `{{ lookPath "delta" }}` false — delta is installed but unshimmed.
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: chezmoi init + apply (twice — second converges modify_ + lookPath drift)
        run: |
          # Symlink into chezmoi's default source dir so later `chezmoi *`
          # calls (including inside bats) need no --source flag.
          mkdir -p "$HOME/.config/chezmoi" "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"

          if [ "${{ matrix.profile }}" != core ]; then
            # Seed the profile before init: --promptDefaults returns
            # promptChoiceOnce's literal default ("core"), never the computed
            # one, so a cached value is the only way to test another tier.
            # init then caches the template hash too, without which later
            # applies warn about a changed config template and bats reads
            # that as drift.
            cat > "$HOME/.config/chezmoi/chezmoi.toml" <<EOF
          [data]
              name    = "CI Tester"
              email   = "ci@example.com"
              profile = "${{ matrix.profile }}"
          EOF
          fi

          chezmoi init --apply --promptDefaults
          echo "--- chezmoi data ---"
          chezmoi data
          # Second apply converges two things: modify_settings.json against
          # what rtk init wrote in pass 1, and the delta blocks in
          # dot_gitconfig.tmpl now that mise has installed it.
          chezmoi apply

      - name: Verify post-apply state
        run: |
          bats tests/files/common.bats
          bats "tests/files/${{ matrix.profile }}.bats"
