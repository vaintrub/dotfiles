name: ci
on:
  push:
    branches: [master, "chore/**", "feat/**", "feature/**", "fix/**", "docs/**"]
  # `pull_request` deliberately omitted: solo repo, no fork PRs expected.
  # Pushes to branches above already cover PR sync (PR view shows latest
  # push's CI status). Re-enable if external contributors start opening PRs
  # from forks (push trigger doesn't fire on fork sources; only
  # `pull_request_target` or `pull_request` does).

jobs:
  lint:
    name: lint (repo invariants + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bats, shellcheck, chezmoi
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bats shellcheck
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"

      - name: Repo invariants
        run: bats tests/unit/

      - name: Shellcheck every script, rendered for each OS and profile
        run: |
          shellcheck -s sh dot_claude/executable_statusline-command.sh
          for profile in core dev workstation; do
            printf '[data]\n    profile = "%s"\n' "$profile" > "$RUNNER_TEMP/chezmoi.toml"
            for os in darwin linux; do
              for f in .chezmoiscripts/*.sh.tmpl .chezmoiscripts/*/*.sh.tmpl; do
                # An OS-guarded script renders to nothing on the other OS;
                # -s sh keeps shellcheck from failing that as SC2148.
                "$HOME/.local/bin/chezmoi" execute-template --source . \
                    --config "$RUNNER_TEMP/chezmoi.toml" \
                    --override-data "{\"chezmoi\":{\"os\":\"$os\"}}" < "$f" \
                  | shellcheck -x -s sh - \
                  || { echo "::error file=$f::shellcheck failed ($os, $profile)"; exit 1; }
              done
            done
          done

  apply:
    # One leg per machine class in the fleet. Casks (workstation) need sudo
    # prompts, so the Mac leg runs dev.
    name: apply (${{ matrix.machine }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { machine: jetson, runner: ubuntu-22.04-arm, profile: dev }
          - { machine: vps, runner: ubuntu-24.04, profile: core }
          - { machine: mac, runner: macos-latest, profile: dev }
    env:
      # Lifts mise's 60/hr anonymous GitHub API rate limit for the dev tier's
      # aqua fetches; harmless at core.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache mise installs
        uses: actions/cache@v6
        with:
          path: ~/.local/share/mise/installs
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${{ hashFiles('dot_config/mise/config.toml.tmpl') }}
          restore-keys: mise-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-

      - name: Install bats + chezmoi
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bats-core
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends bats
          fi
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          # The shims are deliberately not pre-seeded: each script has to put
          # them on PATH itself, as on a real first apply.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: chezmoi init + apply (twice — the second converges what rtk init wrote)
        run: |
          # Symlink into chezmoi's default source dir so later `chezmoi *`
          # calls (including inside bats) need no --source flag.
          mkdir -p "$HOME/.local/share"
          ln -s "$GITHUB_WORKSPACE" "$HOME/.local/share/chezmoi"
          chezmoi init --apply --promptChoice "Install profile=${{ matrix.profile }}"
          chezmoi apply

      - name: Verify post-apply state
        run: |
          bats tests/files/common.bats
          bats "tests/files/${{ matrix.profile }}.bats"
