# model and model_reasoning_effort are deliberately absent: Codex writes both
# from the TUI, and pinning them here would revert the choice on every apply.
personality = "pragmatic"

{{ range .plugins.codex -}}
[plugins."{{ . }}"]
enabled = true

{{ end -}}
# MCP servers (shared list in .chezmoidata/packages.yaml; Claude gets the same
# via `claude mcp add`). Declarative here = no blocking CLI during apply.
{{ range .mcp -}}
[mcp_servers.{{ .name }}]
url = "{{ .url }}"

{{ end -}}
# Sections Codex writes at runtime ([projects.*], [marketplaces.*], [tui.*],
# [notice], ...) are left alone by the merge — see AGENTS.md §9.
