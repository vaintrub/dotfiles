# model_reasoning_effort is deliberately absent: Codex writes it from the TUI,
# and pinning it here would revert the choice on every apply.
model = "gpt-5.6-sol"
personality = "pragmatic"

{{ range .plugins.codex -}}
[plugins."{{ . }}"]
enabled = true

{{ end -}}
# MCP servers (shared list in .chezmoidata/packages.yaml; Claude gets the same
# via `claude mcp add`). Declarative here = no blocking CLI during apply.
{{ range .mcp -}}
[mcp_servers.{{ .name }}]
url = "{{ .url }}"

{{ end -}}
# Runtime-mutated sections ([projects.*], [notice], [tui.*], [tool_suggest],
# [marketplaces.*], [[skills.config]]) are stripped on every apply by
# dot_codex/modify_private_config.toml — see AGENTS.md §9.
